name: "AccuKnox Secret Scan"
description: "Run AccuKnox Secret Security scan on a repository"

branding: 
  icon: "shield" 
  color: "purple"

inputs:
  accuknox_token:
    description: "CSPM token"
    required: true
  accuknox_endpoint:
    description: "CSPM Console endpoint URL"
    required: true
  accuknox_label:
    description: "Label for scan results in AccuKnox Console"
    required: true
  results:
    description: "Which result types to include: verified, unknown, unverified, filtered_unverified"
    required: false
    default: ""
  exclude_paths:
    description: "Comma-separated paths to exclude from filesystem scanning"
    required: false
    default: ""
  additional_arguments:
    description: "Extra arguments to pass to the secret scanning tool"
    required: false
    default: ""
  soft_fail:
    description: "Do not return an error code if there are failed checks"
    required: false
    default: "false"
  upload_results:
    description: "Upload scan results as GitHub artifact"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run AccuKnox Secret Scan
      shell: bash
      env:
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        RESULTS: ${{ inputs.results }}
        EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        ADDITIONAL_ARGUMENTS: ${{ inputs.additional_arguments }}
        SOFT_FAIL: ${{ inputs.soft_fail }}
        UPLOAD_RESULTS: ${{ inputs.upload_results }}
      run: |
        set -e

        EXCLUDE_FILE=""
        trap '[ -n "$EXCLUDE_FILE" ] && rm -f "$EXCLUDE_FILE"' EXIT

        if [ -z "$ACCUKNOX_TOKEN" ] || [ -z "$ACCUKNOX_LABEL" ] || [ -z "$ACCUKNOX_ENDPOINT" ]; then
          echo "ERROR: token, label, and endpoint must be provided!"
          exit 1
        fi

        echo "Downloading AccuKnox ASPM Scanner..."
        curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.15.1/accuknox-aspm-scanner -o accuknox-aspm-scanner
        chmod +x accuknox-aspm-scanner

        echo "Installing local binary and rules (no container image)..."
        ./accuknox-aspm-scanner tool install --type secret

        touch ./results.jsonl
        chmod 666 ./results.jsonl

        # Soft fail argument
        SOFT_FAIL="${SOFT_FAIL//[$'\t\r\n ']}"
        SOFT_FAIL_ARG=""
        if [ "$SOFT_FAIL" = "true" ]; then
          SOFT_FAIL_ARG="--softfail"
        fi

        # Build base command
        BASE_CMD="filesystem ."

        # Add optional CLI arguments
        ARGS=""
        [ -n "$RESULTS" ] && ARGS="$ARGS --results $RESULTS"
        
        EXCLUDE_FILE=""

        if [ -n "$EXCLUDE_PATHS" ]; then
          EXCLUDE_FILE=$(mktemp)

          IFS=',' read -ra PATHS <<< "$EXCLUDE_PATHS"

          for path in "${PATHS[@]}"; do
            path=$(echo "$path" | xargs)
            [ -n "$path" ] && printf '%s\n' "$path" >> "$EXCLUDE_FILE"
          done

          ARGS="$ARGS --exclude-paths $EXCLUDE_FILE"
        fi

        [ -n "$ADDITIONAL_ARGUMENTS" ] && ARGS="$ARGS $ADDITIONAL_ARGUMENTS"

        echo "Running AccuKnox secret scan..."
        echo "./accuknox-aspm-scanner scan --keep-results $SOFT_FAIL_ARG secret --command \"$BASE_CMD $ARGS\" "
        ./accuknox-aspm-scanner scan --keep-results $SOFT_FAIL_ARG secret --command "$BASE_CMD $ARGS"

        cp results.jsonl results-secret.jsonl

    - name: Upload secret scan artifact
      if: ${{ inputs.upload_results == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: secret-scan-results
        path: results-secret.jsonl
        if-no-files-found: error
        retention-days: 30
      
